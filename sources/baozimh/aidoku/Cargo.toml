[package]
name = "baozimh"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs", rev = "ae6485e3c14ecd1fd5497d170eae884c68d04a87" }

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true
